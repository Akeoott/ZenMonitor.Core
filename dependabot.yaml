version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/ZenMonitor.Core*"
      - "/tests/ZenMonitor.Core*"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
