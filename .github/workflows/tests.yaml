name: Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            filter: Platform=Linux
          - os: windows
            runner: windows-latest
            filter: Platform=Windows

    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: "10.0.203"

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Check code style
        run: dotnet format --verify-no-changes --no-restore

      - name: Run ${{ matrix.os }} tests with coverage
        run: >
          dotnet test --no-build --collect:"XPlat Code Coverage"
          --results-directory ./coverage --settings coverlet.runsettings
          --filter "${{ matrix.filter }}"

      - name: Upload to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354
        with:
          directory: ./coverage
          fail_ci_if_error: false
