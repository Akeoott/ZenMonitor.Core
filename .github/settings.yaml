repository:
  name: ZenMonitor.Core
  description: All kinds of system telemetry!
  topics: system-monitoring, dotnet, csharp, nuget
  private: false
  has_issues: true
  has_wiki: false
  has_downloads: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: false

labels:
  - name: "Type: Bug"
    color: e80c0c
    description: Something isn't working as expected.

  - name: "Type: Enhancement"
    color: 54b2ff
    description: Suggest an improvement for an existing feature.

  - name: "Type: Feature"
    color: 54b2ff
    description: Suggest a new feature.

  - name: "Type: Documentation"
    color: 54b2ff
    description: Suggest something about Documentation.

  - name: "Type: Security"
    color: fbff00
    description: A problem or enhancement related to a security issue.

  - name: "Type: Question"
    color: 9309ab
    description: Request for information.

  - name: "Type: Test"
    color: ce54e3
    description: A problem or enhancement related to a test.

  - name: "Type: CI"
    color: 54b2ff
    description: A problem or change related to CI/CD workflows.

  - name: "Status: Awaiting Review"
    color: 24d15d
    description: Ready for review.

  - name: "Status: WIP"
    color: 07b340
    description: Currently being worked on.

  - name: "Status: Waiting"
    color: 6b8e9e
    description: Waiting on something else to be ready.

  - name: "Status: Stale"
    color: 8a6d3b
    description: Has had no activity for some time.

  - name: "Priority: High +"
    color: e80c0c
    description: Task is considered higher-priority.

  - name: "Priority: Med ±"
    color: e8a60c
    description: Task is considered medium-priority.

  - name: "Priority: Low -"
    color: 0c9e3e
    description: Task is considered lower-priority.

  - name: "Duplicate"
    color: EB862D
    description: Duplicate of another issue.

  - name: "Invalid"
    color: c4a500
    description: This issue doesn't seem right.

  - name: "Won't fix"
    color: C8D9E6
    description: Reported issue is working as intended.

  - name: "3rd party issue"
    color: e88707
    description: This issue might be caused by a 3rd party script/package/other reasons

  - name: "Os: Windows"
    color: AEB1C2
    description: Is Windows-specific

  - name: "Os: Mac"
    color: AEB1C2
    description: Is Mac-specific

  - name: "Os: Linux"
    color: AEB1C2
    description: Is Linux-specific
